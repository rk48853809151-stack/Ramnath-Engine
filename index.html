<body style="margin:0; background:#050505; font-family:sans-serif; color:white; overflow-x:hidden;">

    <div id="gameShop" style="padding:30px; text-align:center;">
        <h1 style="color:cyan; text-shadow: 0 0 20px cyan;">🛒 RAMNATH PREMIUM GAME SHOP</h1>
        <hr style="border:1px solid #333;">

        <div style="display:flex; justify-content:center; gap:20px; margin-top:30px; flex-wrap:wrap;">
            
            <div style="width:280px; background:#111; padding:20px; border:2px solid #333; border-radius:15px;">
                <h2 style="color:yellow;">1000+ मैदान</h2>
                <p>यहाँ से अपना पसंदीदा असली मैदान चुनें</p>
                <select id="mapChoice" style="width:100%; padding:10px; background:#222; color:white; border:1px solid cyan;">
                    <option value="Forest">असली हरियाली वाला मैदान</option>
                    <option value="Desert">असली रेतीला मैदान</option>
                    <option value="Night">रात वाला शहर</option>
                </select>
            </div>

            <div style="width:280px; background:#111; padding:20px; border:2px solid #333; border-radius:15px;">
                <h2 style="color:yellow;">असली गाड़ियाँ</h2>
                <div id="preview" style="height:100px; border:1px dashed #444; margin-bottom:10px; display:flex; align-items:center; justify-content:center;">
                    <span id="carLabel" style="color:#666;">खाली जगह</span>
                </div>
                <button onclick="loadCar()" style="width:100%; padding:10px; background:cyan; color:black; font-weight:bold; border:none; cursor:pointer;">गाड़ी चुनें</button>
            </div>

        </div>

        <button onclick="enterWorld()" style="margin-top:50px; padding:20px 80px; font-size:25px; background:red; color:white; border:none; border-radius:50px; cursor:pointer; box-shadow: 0 0 30px red; font-weight:bold;">मैदान में उतरें 🚀</button>
    </div>

    <div id="gameWorld" style="display:none; width:100%; height:100vh; position:relative;">
        <div id="mapInfo" style="position:absolute; top:20px; left:20px; color:cyan; font-size:20px; z-index:10;"></div>
        <div id="realCar" style="width:60px; height:100px; background:white; position:absolute; bottom:50px; left:50%; transform:translateX(-50%); border-radius:8px; box-shadow: 0 0 50px white;">
            <div style="width:50px; height:25px; background:skyblue; margin:10px auto; border-radius:4px;"></div>
        </div>
        <button onclick="backToShop()" style="position:absolute; top:10px; right:10px; padding:10px;">दुकान वापस जाएँ</button>
    </div>

    <script>
        function loadCar() {
            document.getElementById('carLabel').innerHTML = "<div style='width:40px; height:70px; background:white; border-radius:5px;'></div><br>कार लोड हो गई!";
            document.getElementById('carLabel').style.color = "cyan";
            alert("दुकान से असली सफ़ेद कार चुन ली गई है!");
        }

        function enterWorld() {
            const map = document.getElementById('mapChoice').value;
            document.getElementById('gameShop').style.display = "none";
            document.getElementById('gameWorld').style.display = "block";
            
            let color = (map == "Forest") ? "#1b5e20" : (map == "Desert") ? "#e67e22" : "#1a1a1a";
            document.getElementById('gameWorld').style.background = color;
            document.getElementById('mapInfo').innerHTML = "चुना हुआ मैदान: " + map;
        }

        function backToShop() {
            document.getElementById('gameShop').style.display = "block";
            document.getElementById('gameWorld').style.display = "none";
        }
    </script>
</body>
