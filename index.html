<body style="margin:0; background:#000; font-family:sans-serif; color:white; overflow:hidden;">

    <div id="app-interface" style="width:100%; height:100vh; display:flex; flex-direction:column;">
        
        <div style="background:#1a1a1a; padding:15px; border-bottom:2px solid cyan; display:flex; gap:10px;">
            <input type="text" id="searchBar" placeholder="मैदान या गाड़ी सर्च करें..." style="flex:1; padding:12px; border-radius:5px; border:none; background:#333; color:white;">
            <button onclick="runSearch()" style="padding:10px 20px; background:cyan; border:none; border-radius:5px; font-weight:bold;">खोजें</button>
        </div>

        <div id="shopFloor" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-wrap:wrap; gap:20px; justify-content:center; align-content:flex-start;">
            <p id="hint">सर्च बॉक्स में 'मैदान' या 'गाड़ी' लिखें...</p>
        </div>
    </div>

    <script>
        function runSearch() {
            const query = document.getElementById('searchBar').value;
            const floor = document.getElementById('shopFloor');
            floor.innerHTML = ""; // पुराना हटाओ

            if(query.includes("मैदान")) {
                for(let i=1; i<=6; i++) {
                    floor.innerHTML += `
                        <div onclick="alert('मैदान लोड हो रहा है...')" style="width:140px; height:180px; background:#222; border-radius:10px; border:1px solid #444; text-align:center;">
                            <img src="https://img.icons8.com/color/96/mountain.png" style="width:80%; margin-top:10px;">
                            <p>असली मैदान ${i}</p>
                            <button style="background:green; color:white; border:none; padding:5px;">चुनें</button>
                        </div>`;
                }
            } else if(query.includes("गाड़ी")) {
                floor.innerHTML = `
                    <div onclick="alert('खाली गाड़ी तैयार है')" style="width:140px; height:180px; background:#222; border-radius:10px; border:1px solid #444; text-align:center;">
                        <img src="https://img.icons8.com/color/96/car.png" style="width:80%; margin-top:10px;">
                        <p>खाली गाड़ी</p>
                        <button style="background:cyan; color:black; border:none; padding:5px;">चुनें</button>
                    </div>`;
            } else {
                floor.innerHTML = "<p>कुछ नहीं मिला। 'मैदान' या 'गाड़ी' लिख कर देखें।</p>";
            }
        }
    </script>
</body>
