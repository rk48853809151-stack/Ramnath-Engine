<body style="margin:0; background:#0a0a0a; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:white; overflow-x:hidden;">

    <header style="background: linear-gradient(90deg, #1a1a1a, #333); padding: 20px; text-align: center; border-bottom: 3px solid cyan; box-shadow: 0 5px 15px rgba(0,255,255,0.2);">
        <h1 style="margin:0; color:cyan; text-transform:uppercase; letter-spacing:3px;">🛒 RAMNATH GAME WORLD SHOP</h1>
        <p style="margin:5px 0 0; color:#888;">दुनिया का सबसे खतरनाक गेमिंग स्टोर</p>
    </header>

    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:40px;">
        
        <div style="width:300px; background:#1a1a1a; border:1px solid #333; border-radius:15px; padding:20px; text-align:center;">
            <div style="font-size:50px;">🌍</div>
            <h2>मैदान चुनिए</h2>
            <p>1000+ से अधिक मैदान उपलब्ध हैं</p>
            <select id="mapSelect" style="width:100%; padding:10px; background:#333; color:white; border:1px solid cyan;">
                <option>रेतीला मैदान (Desert)</option>
                <option>हरियाली वाला मैदान (Forest)</option>
                <option>बर्फीला मैदान (Snow)</option>
                <option>शहर की सड़कें (City)</option>
            </select>
        </div>

        <div style="width:300px; background:#1a1a1a; border:1px solid #333; border-radius:15px; padding:20px; text-align:center;">
            <div style="font-size:50px;">🏎️</div>
            <h2>गाड़ी चुनिए</h2>
            <p>असली 3D मॉडल्स का कलेक्शन</p>
            <div id="carPreview" style="height:80px; background:#000; margin:10px 0; border:1px dashed #555; display:flex; align-items:center; justify-content:center;">
                <span id="carStatus" style="color:#555;">खाली गाड़ी</span>
            </div>
            <button onclick="pickCar()" style="width:100%; padding:10px; background:cyan; color:black; font-weight:bold; border:none; cursor:pointer;">गाड़ी लोड करें</button>
        </div>

    </div>

    <div style="text-align:center; padding-bottom:50px;">
        <button onclick="enterEngine()" style="padding:20px 60px; font-size:24px; background:red; color:white; border:none; border-radius:50px; font-weight:bold; cursor:pointer; box-shadow: 0 0 20px red;">START REAL ENGINE 🚀</button>
    </div>

    <script>
        function pickCar() {
            document.getElementById('carStatus').innerHTML = "🏎️ असली कार तैयार है!";
            document.getElementById('carStatus').style.color = "cyan";
            alert("बधाई हो! दुकान से असली गाड़ी चुन ली गई है।");
        }
        function enterEngine() {
            const map = document.getElementById('mapSelect').value;
            alert(map + " के साथ गेम इंजन चालू हो रहा है...");
            // यहाँ हम अगला 3D लेवल लोड करेंगे
        }
    </script>
</body>
